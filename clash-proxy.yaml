# ==============================================================
# [proxy-groups] 策略组
# ==============================================================
proxy-groups:
  - name: 🚀 代理选择
    type: select
    proxies:
      - ♻️ 自动选择
      - Google-all
      - Google-VLESS

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - Google-all
      - Google-VLESS

  - name: CF自动
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - CF官方优选
      - CF官方优选 2
      - CF官方优选 3
      - CF官方优选 4
      - CF官方优选 5
      - CF官方优选 6
      - CF官方优选 7
      - CF官方优选 8

  - name: 🚀 节点选择
    type: select
    proxies:
      - 🚀 代理选择
      - ♻️ 自动选择
      - Google-all
      - Google-VLESS
      - DIRECT

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 代理选择

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - DIRECT
      - 🚀 代理选择
      - ♻️ 自动选择
      - Google-all
      - Google-VLESS

  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 代理选择
      - ♻️ 自动选择
      - Google-all
      - Google-VLESS

  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 代理选择
      - Google-all
      - Google-VLESS
      - ♻️ 自动选择

  - name: 💬 Ai平台
    type: select
    proxies:
      - 🚀 代理选择
      - Google-all
      - Google-VLESS
      - ♻️ 自动选择

