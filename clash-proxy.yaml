# ==============================================================
# 这是Clash Verge配置文件，核心原则：仅做功能增量，不做逻辑重构。 如果你发现我的配置有"过期"或"次优"的地方：不要直接改在我的代码里。请在回复的代码块下方，单独开辟一个 [💡 专业建议] 区域。在这个区域里，用简洁的语言告诉我："我注意到你的 XXX 规则可能过时了，更好的方案是 XXX，这样做的好处是 XXX。"
# 基础设置
# ==============================================================
mode: rule
mixed-port: 7890
allow-lan: true
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
secret: "set-your-secret"

dns:
  enable: true
  listen: "0.0.0.0:53"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter-mode: "blacklist"
  prefer-h3: false
  respect-rules: true # 建议设为 true，让规则控制解析逻辑
  use-hosts: true
  use-system-hosts: true
  ipv6: false
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  nameserver:
    - "223.5.5.5" # 物理距离最近，放在最首位
    - "https://dns.alicdn.com/dns-query"
    - "https://doh.pub/dns-query"
  fallback:
    - "https://dns.google/dns-query"
    - "tls://8.8.8.8"
  fallback-filter:
    geoip: true
    geoip-code: "CN"
    ipcidr:
      - "240.0.0.0/4"

  # [优化] 精准分流解析，降低延迟
  nameserver-policy:
    "geosite:cn": [223.5.5.5, 119.29.29.29]
    "geosite:category-ads-all": "127.0.0.1"
    "+.apple.com": [223.5.5.5, 119.29.29.29]
    "+.microsoft.com": [223.5.5.5, 119.29.29.29]

  # 必须添加以下部分，不能留空
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alicdn.com/dns-query

